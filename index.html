<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog &mdash; SAT vocabulary drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --card:#FFFDF8;
    --ink:#2B2620;
    --ink-soft:#7A7264;
    --rule:#D9CFB8;
    --rule-strong:#C3B896;
    --stamp:#1F3A5F;
    --stamp-soft:#DCE6F0;
    --moss:#3F6B3F;
    --moss-soft:#DCEBDC;
    --brick:#A23B2E;
    --brick-soft:#F4DAD3;
    --radius:3px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#191712;
      --card:#221F19;
      --ink:#EDE6D6;
      --ink-soft:#9C9384;
      --rule:#3A362C;
      --rule-strong:#4A4536;
      --stamp:#7FA6D6;
      --stamp-soft:#26364A;
      --moss:#8FC28F;
      --moss-soft:#243424;
      --brick:#E08A7A;
      --brick-soft:#3E2620;
    }
  }
  :root[data-theme="dark"]{
    --paper:#191712;
    --card:#221F19;
    --ink:#EDE6D6;
    --ink-soft:#9C9384;
    --rule:#3A362C;
    --rule-strong:#4A4536;
    --stamp:#7FA6D6;
    --stamp-soft:#26364A;
    --moss:#8FC28F;
    --moss-soft:#243424;
    --brick:#E08A7A;
    --brick-soft:#3E2620;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  body{
    padding:28px 16px 72px;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 32px;
    background-attachment: local;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-soft);
  }
  .title{
    font-family:'Spectral',serif;
    font-size:26px;
    font-weight:700;
    margin:2px 0 0;
    color:var(--ink);
  }
  .catno{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }

  .drawer{
    display:flex;
    gap:0;
    margin:18px 0 22px;
  }
  .drawer button{
    flex:1;
    background:var(--card);
    border:1px solid var(--rule-strong);
    border-bottom:none;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    padding:10px 6px;
    position:relative;
    top:1px;
  }
  .drawer button + button{ border-left:none; }
  .drawer button.active{
    color:var(--ink);
    background:var(--paper);
    border-bottom:1px solid var(--paper);
  }

  .progressrail{
    display:flex; align-items:center; gap:10px;
    margin-bottom:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .progressbar{flex:1;height:3px;background:var(--rule);position:relative;}
  .progressbar-fill{position:absolute;top:0;left:0;height:100%;background:var(--stamp);}

  .card{
    background:var(--card);
    border:1px solid var(--rule-strong);
    border-radius:var(--radius);
    padding:34px 28px 28px;
    min-height:240px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
    position:relative;
    box-shadow: 3px 3px 0 var(--rule);
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:36px;
    width:1px; height:100%;
    background:var(--brick-soft);
    opacity:0.7;
  }
  .pos{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--stamp);
    margin:0 0 12px;
  }
  .headword{
    font-family:'Spectral',serif;
    font-size:34px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--ink);
  }
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:20px;font-style:italic;}
  .definition{
    font-family:'Spectral',serif;
    font-size:18px;
    line-height:1.55;
    margin:0 0 12px;
  }
  .example{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:0;
    padding-left:12px;
    border-left:2px solid var(--rule-strong);
  }
  .controls{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;
    padding:11px;
    border-radius:var(--radius);
    border:1px solid var(--rule-strong);
    background:var(--card);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink);
  }
  .btn.know{border-color:var(--moss);background:var(--moss-soft);color:var(--moss);}
  .btn.review{border-color:var(--brick);background:var(--brick-soft);color:var(--brick);}
  .btn:disabled{opacity:0.45;cursor:default;}

  .quiz-options{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
  .qopt{
    text-align:left;
    padding:13px 15px;
    border-radius:var(--radius);
    border:1px solid var(--rule-strong);
    background:var(--card);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .qopt.correct{border-color:var(--moss);background:var(--moss-soft);}
  .qopt.wrong{border-color:var(--brick);background:var(--brick-soft);}
  .qopt:disabled{cursor:default;}
  .quiz-word{
    font-family:'Spectral',serif;
    font-size:25px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .quiz-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin:0 0 18px;}
  .next-row{margin-top:18px;display:flex;justify-content:flex-end;}
  .next-row button{
    padding:10px 18px;border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;font-weight:500;cursor:pointer;
  }
  .score{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:14px;text-align:center;}

  .wordlist{display:flex;flex-direction:column;gap:1px;background:var(--rule-strong);border:1px solid var(--rule-strong);}
  .wrow{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);
    padding:11px 14px;
  }
  .wrow .w{font-family:'Spectral',serif;font-size:15.5px;font-weight:600;color:var(--ink);}
  .wrow .status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 8px;border-radius:20px;}
  .status.mastered{background:var(--moss-soft);color:var(--moss);}
  .status.learning{background:var(--brick-soft);color:var(--brick);}
  .status.new{background:var(--rule);color:var(--ink-soft);}

  .addform{
    background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .addform h3{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;margin:0 0 14px;font-weight:500;color:var(--ink-soft);}
  .addform input,.addform textarea{
    width:100%;padding:10px 11px;border-radius:2px;border:1px solid var(--rule-strong);
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;margin-bottom:9px;background:var(--paper);
    color:var(--ink);
  }
  .addform textarea{resize:vertical;min-height:52px;}
  .addform button{
    padding:10px 16px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);
    color:var(--paper);font-size:13.5px;font-weight:500;cursor:pointer;
  }
  .err{color:var(--brick);font-size:12px;margin:-2px 0 10px;}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px 0;font-family:'IBM Plex Mono',monospace;}
  .reset-row{margin-top:26px;text-align:center;}
  .reset-row button{
    background:none;border:none;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-decoration:underline;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="brand">field catalog</p>
      <p class="title">Word Drawer</p>
    </div>
    <p class="catno" id="catNo">card 0 / 0</p>
  </header>

  <div class="progressrail">
    <span id="progressLabel">0 mastered</span>
    <div class="progressbar"><div class="progressbar-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <nav class="drawer">
    <button class="active" data-tab="learn">Learn</button>
    <button data-tab="quiz">Quiz</button>
    <button data-tab="words">My words</button>
  </nav>

  <div id="panel"></div>

  <div class="reset-row"><button id="resetBtn">Reset progress</button></div>
</div>

<script>
const BASE_WORDS = [
["ubiquitous","adjective","present or found everywhere at once","Wifi is so ubiquitous now that its absence feels like the anomaly."],
["ephemeral","adjective","lasting only a brief time","Their bracket lead was ephemeral; a single missed free throw ended it."],
["mitigate","verb","to make a harm or risk less severe","The levee was raised to mitigate flood damage downstream."],
["candid","adjective","frank and unfiltered in speech","The coach's candid postgame remarks surprised the reporters."],
["ambivalent","adjective","holding two conflicting feelings at once","She was ambivalent about the transfer, excited yet reluctant to leave."],
["pragmatic","adjective","guided by practical results over theory","Facing a tight deadline, the team took the pragmatic route and shipped a smaller feature."],
["skeptical","adjective","inclined to doubt without further proof","Reviewers stayed skeptical of the study until a second lab confirmed it."],
["arbitrary","adjective","chosen without a clear reasoned basis","The seating chart seemed arbitrary until we noticed it was alphabetical by hometown."],
["cohesive","adjective","unified and consistent as a whole","The band's second album feels far more cohesive than its debut."],
["diligent","adjective","persistently careful and thorough","A diligent proofreader caught the typo three editors had missed."],
["eloquent","adjective","fluent and persuasive in expression","Her eloquent closing argument swayed even the skeptical jurors."],
["frugal","adjective","sparing with money or resources","He stayed frugal even after the promotion, still packing lunch daily."],
["hypothesis","noun","a testable proposed explanation","Their hypothesis was that warmer water slows the fish's reaction time."],
["indifferent","adjective","lacking interest or concern either way","The cat seemed indifferent to the new toy within minutes."],
["juxtapose","verb","to place side by side for contrast","The mural juxtaposes a factory skyline with an untouched forest."],
["lucid","adjective","clear and easy to follow","His lucid summary made the tax law finally make sense to me."],
["meticulous","adjective","extremely careful about details","The restorer was meticulous, matching each paint fleck to the original."],
["novel","adjective","new and not seen before","The startup's novel approach to recycling batteries drew instant attention."],
["obsolete","adjective","no longer in current use","The floppy disk drive on the shelf is now completely obsolete."],
["plausible","adjective","reasonable and believable","Her alibi was plausible enough that detectives looked elsewhere."],
["quell","verb","to suppress or put an end to","A short statement from the CEO helped quell the rumors."],
["resilient","adjective","able to recover quickly from difficulty","The coral proved more resilient to the heatwave than researchers expected."],
["succinct","adjective","expressed in few words","His succinct email answered every question in three sentences."],
["tenuous","adjective","weak or easily broken","The link between the two events is tenuous at best."],
["undermine","verb","to weaken gradually, often secretly","Constant last-minute changes began to undermine the team's trust in the plan."],
["vindicate","verb","to clear from blame with proof","The old test results finally vindicated the discredited researcher."],
["wary","adjective","cautious of possible danger","Locals grew wary of the trail after the second rockslide."],
["zealous","adjective","filled with eager enthusiasm","The zealous volunteers had the shelter repainted before noon."],
["benevolent","adjective","kind and well-meaning","The benevolent landlord waived a month's rent during the shutdown."],
["cryptic","adjective","having a puzzling, hidden meaning","The postcard's cryptic message took us a week to decode."]
];

let words = [];
let progress = {};
let tab = 'learn';
let learnIdx = 0;
let learnFlipped = false;
let quizPool = [];
let quizIdx = 0;
let quizAnswered = false;
let quizScore = {correct:0, total:0};

const panel = document.getElementById('panel');

function loadData(){
  let customWords = [];
  try{
    const raw = localStorage.getItem('wd-custom-words');
    if(raw) customWords = JSON.parse(raw);
  }catch(e){}
  words = BASE_WORDS.map(w=>({word:w[0],pos:w[1],def:w[2],example:w[3],custom:false}))
    .concat(customWords.map(w=>({...w,custom:true})));
  try{
    const raw = localStorage.getItem('wd-progress');
    if(raw) progress = JSON.parse(raw);
  }catch(e){}
  render();
}

function saveProgress(){
  try{ localStorage.setItem('wd-progress', JSON.stringify(progress)); }catch(e){}
}
function saveCustomWords(){
  const custom = words.filter(w=>w.custom).map(({word,pos,def,example})=>({word,pos,def,example}));
  try{ localStorage.setItem('wd-custom-words', JSON.stringify(custom)); }catch(e){}
}

function status(w){
  return progress[w.word] || 'new';
}

function updateProgressBar(){
  const mastered = words.filter(w=>status(w)==='mastered').length;
  const pct = words.length ? Math.round((mastered/words.length)*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = mastered+' of '+words.length+' mastered';
  document.getElementById('catNo').textContent = 'card '+(words.length?Math.min(learnIdx+1,words.length):0)+' / '+words.length;
}

function setTab(t){
  tab = t;
  document.querySelectorAll('.drawer button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  if(t==='quiz') startQuiz();
  render();
}
document.querySelectorAll('.drawer button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.getElementById('resetBtn').addEventListener('click', ()=>{
  progress = {};
  saveProgress();
  learnIdx = 0; learnFlipped = false;
  render();
});

function render(){
  updateProgressBar();
  if(words.length===0){
    panel.innerHTML = '<p class="empty">drawer is empty — add a card in "My words"</p>';
    return;
  }
  if(tab==='learn') renderLearn();
  else if(tab==='quiz') renderQuiz();
  else renderWords();
}

function renderLearn(){
  if(learnIdx>=words.length) learnIdx = 0;
  const w = words[learnIdx];
  const st = status(w);
  panel.innerHTML = `
    <div class="card" id="flashcard">
      <p class="pos">${w.pos}</p>
      <p class="headword">${w.word}</p>
      ${learnFlipped ? `
        <p class="definition">${w.def}</p>
        <p class="example">${w.example}</p>
      ` : `<p class="hint">tap the card to reveal the definition</p>`}
    </div>
    <div class="controls">
      <button class="btn review" id="btnReview" ${!learnFlipped?'disabled':''}>Still learning</button>
      <button class="btn know" id="btnKnow" ${!learnFlipped?'disabled':''}>Know it</button>
    </div>
    <p class="score">card ${learnIdx+1} of ${words.length} &middot; status: ${st}</p>
  `;
  document.getElementById('flashcard').addEventListener('click', ()=>{
    learnFlipped = !learnFlipped;
    render();
  });
  const rb = document.getElementById('btnReview');
  const kb = document.getElementById('btnKnow');
  if(rb) rb.addEventListener('click', (e)=>{
    e.stopPropagation();
    progress[w.word] = 'learning';
    saveProgress();
    nextLearn();
  });
  if(kb) kb.addEventListener('click', (e)=>{
    e.stopPropagation();
    progress[w.word] = 'mastered';
    saveProgress();
    nextLearn();
  });
}
function nextLearn(){
  learnIdx = (learnIdx+1) % words.length;
  learnFlipped = false;
  render();
}

function startQuiz(){
  quizPool = [...words].sort(()=>Math.random()-0.5).slice(0, Math.min(10, words.length));
  quizIdx = 0;
  quizAnswered = false;
  quizScore = {correct:0, total:0};
}
function renderQuiz(){
  if(quizPool.length===0) startQuiz();
  if(quizIdx>=quizPool.length){
    panel.innerHTML = `
      <div class="card" style="cursor:default;">
        <p class="pos">quiz complete</p>
        <p class="headword">${quizScore.correct} / ${quizScore.total}</p>
        <p class="hint">nice run — start another round any time</p>
      </div>
      <div class="next-row"><button id="againBtn">New quiz</button></div>
    `;
    document.getElementById('againBtn').addEventListener('click', ()=>{ startQuiz(); render(); });
    return;
  }
  const w = quizPool[quizIdx];
  let opts = [w];
  const distractors = words.filter(x=>x.word!==w.word).sort(()=>Math.random()-0.5).slice(0,3);
  opts = opts.concat(distractors).sort(()=>Math.random()-0.5);
  panel.innerHTML = `
    <div class="card" style="cursor:default;">
      <p class="pos">${w.pos} &middot; question ${quizIdx+1} of ${quizPool.length}</p>
      <p class="quiz-word">${w.word}</p>
      <p class="quiz-meta">choose the correct definition</p>
      <div class="quiz-options">
        ${opts.map((o,i)=>`<button class="qopt" data-word="${o.word}" data-idx="${i}">${o.def}</button>`).join('')}
      </div>
      <div class="next-row" id="nextRow" style="display:none;"><button id="nextBtn">Next</button></div>
    </div>
  `;
  document.querySelectorAll('.qopt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const chosen = btn.dataset.word;
      const correct = chosen === w.word;
      quizScore.total++;
      if(correct){
        quizScore.correct++;
        progress[w.word] = 'mastered';
        btn.classList.add('correct');
      } else {
        progress[w.word] = 'learning';
        btn.classList.add('wrong');
        document.querySelectorAll('.qopt').forEach(b=>{
          if(b.dataset.word===w.word) b.classList.add('correct');
        });
      }
      saveProgress();
      document.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
      document.getElementById('nextRow').style.display='flex';
      updateProgressBar();
    });
  });
  const nb = document.getElementById('nextBtn');
  if(nb) nb.addEventListener('click', ()=>{
    quizIdx++;
    quizAnswered = false;
    render();
  });
}

function renderWords(){
  const rows = words.map(w=>{
    const st = status(w);
    return `<div class="wrow"><span class="w">${w.word}</span><span class="status ${st}">${st}</span></div>`;
  }).join('');
  panel.innerHTML = `
    <div class="addform">
      <h3>add a card</h3>
      <input type="text" id="newWord" placeholder="Word" />
      <input type="text" id="newPos" placeholder="Part of speech (e.g. adjective)" />
      <textarea id="newDef" placeholder="Definition"></textarea>
      <textarea id="newEx" placeholder="Example sentence"></textarea>
      <p class="err" id="addErr" style="display:none;"></p>
      <button id="addBtn">Add to drawer</button>
    </div>
    <div class="addform">
      <h3>bulk add — paste many at once</h3>
      <p class="hint" style="margin:-4px 0 10px;">one word per line, fields separated by <strong>|</strong>:<br>word | part of speech | definition | example sentence<br>(part of speech and example are optional — "word | definition" also works)</p>
      <textarea id="bulkText" placeholder="ubiquitous | adjective | present everywhere | Wifi is ubiquitous now.
ephemeral | lasting a short time
mitigate | verb | to lessen severity | New rules mitigate the risk." style="min-height:140px;"></textarea>
      <p class="err" id="bulkErr" style="display:none;"></p>
      <button id="bulkBtn">Add all</button>
    </div>
    <div class="wordlist">${rows}</div>
  `;
  document.getElementById('addBtn').addEventListener('click', ()=>{
    const word = document.getElementById('newWord').value.trim();
    const pos = document.getElementById('newPos').value.trim() || 'word';
    const def = document.getElementById('newDef').value.trim();
    const example = document.getElementById('newEx').value.trim() || '—';
    const err = document.getElementById('addErr');
    if(!word || !def){
      err.textContent = 'enter at least a word and a definition';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    words.push({word,pos,def,example,custom:true});
    saveCustomWords();
    render();
  });
  document.getElementById('bulkBtn').addEventListener('click', ()=>{
    const raw = document.getElementById('bulkText').value;
    const err = document.getElementById('bulkErr');
    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    if(lines.length===0){
      err.textContent = 'paste at least one line first';
      err.style.display = 'block';
      return;
    }
    let added = 0, skipped = 0;
    const existing = new Set(words.map(w=>w.word.toLowerCase()));
    lines.forEach(line=>{
      const parts = line.split('|').map(p=>p.trim()).filter(p=>p.length>0 || p==='');
      let word, pos, def, example;
      if(parts.length>=4){ [word,pos,def,example] = parts; }
      else if(parts.length===3){ [word,pos,def] = parts; example='—'; }
      else if(parts.length===2){ [word,def] = parts; pos='word'; example='—'; }
      else { skipped++; return; }
      word = (word||'').trim(); def = (def||'').trim();
      if(!word || !def || existing.has(word.toLowerCase())){ skipped++; return; }
      words.push({word, pos:(pos||'word').trim(), def, example:(example||'—').trim(), custom:true});
      existing.add(word.toLowerCase());
      added++;
    });
    saveCustomWords();
    if(skipped>0){
      err.textContent = `added ${added}, skipped ${skipped} (missing a word/definition, or duplicate)`;
      err.style.display = 'block';
    } else {
      err.style.display = 'none';
    }
    render();
  });
}

loadData();
</script>
</body>
</html>
